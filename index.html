<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini POS & Kasir Web - RPL</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

    <header class="text-white shadow-sm p-3 mb-4" style="background-color: #4f46e5;">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h5 mb-0 fw-bold">🛒 Kasir Web Mini</h1>
        </div>
    </header>

    <main class="container pb-5">
        <div class="row g-4">

            <div class="col-lg-8">

                <div class="row g-3 mb-4">
                    <div class="col-sm-4">
                        <div class="card p-3 shadow-sm border-0">
                            <small class="text-muted">Total Omzet Harian</small>
                            <h3 id="total-omzet" class="fw-bold fs-4 mt-1" style="color: #4f46e5;">Rp 0</h3>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="card p-3 shadow-sm border-0">
                            <small class="text-muted">Sisa Total Stok</small>
                            <h3 id="total-stok" class="text-success fw-bold fs-4 mt-1">0</h3>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="card p-3 shadow-sm border-0">
                            <small class="text-muted">Transaksi Berjalan</small>
                            <h3 id="jumlah-transaksi" class="text-warning fw-bold fs-4 mt-1">0</h3>
                        </div>
                    </div>
                </div>
              
                <div class="card p-4 shadow-sm border-0 mb-4">
                    <h2 class="h6 fw-bold mb-3">📦 Tambah Produk Baru ke Stok</h2>
                    <form id="form-produk" class="row g-2">
                        <div class="col-md-4">
                            <input type="text" id="nama-produk" placeholder="Nama Barang" required class="form-control form-control-sm">
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="harga-produk" placeholder="Harga (Rp)" required class="form-control form-control-sm">
                        </div>
                        <div class="col-md-4">
                            <input type="number" id="stok-produk" placeholder="Jumlah Stok" required class="form-control form-control-sm">
                        </div>
                        <div class="col-12 mt-2">
                            <button type="submit" class="btn text-white btn-sm w-100" style="background-color: #4f46e5;">Simpan Produk</button>
                        </div>
                    </form>
                </div>

                <div>
                    <h2 class="h6 fw-bold mb-3">🛍️ Katalog Barang</h2>
                    <div id="katalog-container" class="row g-3">
                        <!-- Data produk dimasukkan lewat JavaScript -->
                    </div>
                </div>

            </div>

            <div class="col-lg-4">
                <div class="card p-4 shadow-sm border-0">
                    <h2 class="h6 fw-bold mb-3">🛒 Keranjang Belanja</h2>
                    <div id="keranjang-container" class="border-bottom pb-2 mb-3" style="max-height: 220px; overflow-y: auto;">
                        <p class="text-muted text-center small py-3">Keranjang masih kosong</p>
                    </div>
                  
                    <div>
                        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                            <span>Total Bayar:</span>
                            <span id="grand-total" style="color: #4f46e5;">Rp 0</span>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small text-muted">Metode Pembayaran</label>
                            <select id="metode-pembayaran" class="form-select form-select-sm">
                                <option value="Tunai">Tunai (Cash)</option>
                                <option value="QRIS">QRIS</option>
                                <option value="Transfer Bank">Transfer Bank</option>
                            </select>
                        </div>

                        <div class="mb-3" id="wrapper-tunai">
                            <label class="form-label small text-muted">Uang Tunai Diterima</label>
                            <input type="number" id="uang-tunai" placeholder="Contoh: 50000" class="form-control form-control-sm">
                            <small class="d-block mt-1">Kembalian: <span id="info-kembalian" class="fw-bold text-success">Rp 0</span></small>
                        </div>

                        <button id="btn-proses" onclick="prosesTransaksi()" class="btn btn-success btn-sm w-100 py-2">
                            Proses & Cetak Struk
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
